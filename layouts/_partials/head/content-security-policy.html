<!-- https://report-uri.com/home/generate -->
<!-- 'unsafe-inline' in style-src is required because Bootstrap applies inline styles
     at runtime (e.g. carousel transforms, collapse height, tooltip positioning).
     fonts.googleapis.com and fonts.gstatic.com are required for the Georama font. -->
<meta http-equiv='Content-Security-Policy' content="script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'none'">
